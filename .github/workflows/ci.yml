name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx vitest run src/__tests__/permissions.test.ts src/__tests__/formatters.test.ts
      - run: npx tsc --noEmit
